# Conda environment for the CF_v2 electrode-insertion simulation.
#
# Normally you do not run this by hand - `bash setup.sh` builds the
# environment from this file into ./.venv. To do it manually:
#
#     conda env create -p ./.venv -f environment.yml
#
# Conda is the recommended route because pyvista pulls in VTK, a large
# compiled dependency that conda-forge ships as a prebuilt binary for macOS
# (arm64 and x86_64), Linux and Windows. `pip install -r requirements.txt` is
# the fallback when conda is unavailable.
#
# Why the version bounds are not just floors: with floors only, the solver is
# free to take the oldest pyvista and the newest VTK, and that pairing does
# not work (pyvista 0.44 against VTK 9.7 fails with "cannot import name
# vtkCapsuleSource"). pyvista and vtk are therefore pinned to a series that is
# known to work together, and pandas is capped below 3.0, which is a breaking
# release. Exact versions live in requirements-lock.txt.
name: cf_v2
channels:
  - conda-forge
dependencies:
  - python=3.12
  # --- core numerics ---
  - numpy>=1.24,<3
  - scipy>=1.13,<2       # ndimage.label, ndimage.sum, spatial.cKDTree
  - pandas>=2.0,<3
  # --- image IO ---
  - tifffile>=2024.1.1   # reads the 1.5 GB 3-D tif stacks
  - pillow>=10.0         # re-saves rendered figures at 300 dpi
  # --- 3-D rendering (keep these two in step; see note above) ---
  - pyvista=0.45.*
  - vtk=9.4.*
  # --- misc ---
  - matplotlib>=3.8,<4
  - tqdm>=4.66
  # --- to run the notebooks ---
  - ipykernel>=6.29
  - jupyterlab>=4.0
  - notebook>=7.0
